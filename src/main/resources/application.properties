spring.application.name=aiexpensetracker

spring.devtools.restart.enabled=false


server.servlet.context-path=/aiexpense

#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=tracker
#spring.datasource.password=vinay@2001



#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true



#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/expense_db
#spring.datasource.url=jdbc:mysql://localhost:3306/expense_db
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



#logging.file.name=logs/expense-tracker.log

logging.file.name=logs/expense-tracker.log
logging.logback.rollingpolicy.file-name-pattern=logs/expense-tracker-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=7



logging.level.root=INFO
logging.level.com.damon.ai.expense.trackerr.aiexpensetracker.logging.logs=DEBUG
logging.level.com.damon.ai.expense.trackerr=DEBUG
logging.level.org.springframework.web=DEBUG

logbook.format.style=http
logging.level.org.zalando.logbook=TRACE
logbook.format.style=json
#logging.level.org.zalando.logbook=TRACE


# Enable request logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG


# --- Server thread pool tuning ---
server.tomcat.max-threads=200
server.tomcat.accept-count=100

# --- HikariCP connection pool tuning ---
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always



gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent


# --- Otp Lenght ---
otp.length=6

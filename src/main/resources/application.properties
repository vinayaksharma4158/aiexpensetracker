spring.datasource.url=jdbc:mysql://localhost:3306/expense_db
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect



#logging.file.name=logs/expense-tracker.log

logging.file.name=logs/expense-tracker.log
logging.logback.rollingpolicy.file-name-pattern=logs/expense-tracker-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=7



logging.level.root=INFO
logging.level.com.damon.ai.expense.trackerr.aiexpensetracker.logging.logs=DEBUG

logbook.format.style=http
logging.level.org.zalando.logbook=TRACE

# Enable request logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG



